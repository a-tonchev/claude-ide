<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#13131D"/>
    </linearGradient>
    <!-- Prompt glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Outer glow for the spark -->
    <filter id="sparkGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Accent gradient for prompt -->
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EB8DA"/>
      <stop offset="100%" stop-color="#5B86B0"/>
    </linearGradient>
    <!-- Cursor blink gradient -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CB368"/>
      <stop offset="100%" stop-color="#5A9A42"/>
    </linearGradient>
    <!-- Spark gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A853"/>
      <stop offset="50%" stop-color="#CC7832"/>
      <stop offset="100%" stop-color="#E8A853"/>
    </linearGradient>
    <!-- Border glow gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6897BB" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7CB368" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#CC7832" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Terminal window dots -->
  <circle cx="108" cy="108" r="14" fill="#E5534B" opacity="0.85"/>
  <circle cx="152" cy="108" r="14" fill="#E8A853" opacity="0.85"/>
  <circle cx="196" cy="108" r="14" fill="#57AB5A" opacity="0.85"/>

  <!-- Terminal prompt ">" with glow -->
  <text x="100" y="310" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-weight="700" font-size="200" fill="url(#promptGrad)" filter="url(#glow)" opacity="0.95">&gt;_</text>

  <!-- AI spark / star (top right) -->
  <g transform="translate(390, 140)" filter="url(#sparkGlow)">
    <!-- 4-pointed star -->
    <path d="M0,-32 L6,-6 L32,0 L6,6 L0,32 L-6,6 L-32,0 L-6,-6 Z" fill="url(#sparkGrad)" opacity="0.95"/>
    <!-- Small secondary spark -->
    <path d="M28,-28 L30,-22 L36,-20 L30,-18 L28,-12 L26,-18 L20,-20 L26,-22 Z" fill="#E8A853" opacity="0.7"/>
  </g>

  <!-- Subtle scan line effect -->
  <line x1="100" y1="360" x2="412" y2="360" stroke="#6897BB" stroke-width="2" opacity="0.15"/>
  <line x1="100" y1="380" x2="320" y2="380" stroke="#6897BB" stroke-width="2" opacity="0.1"/>
</svg>
